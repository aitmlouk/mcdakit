<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three bars of differing height: a ranking. currentColor is not
       available to a favicon, so the teal is fixed and chosen to be legible
       against both a light and a dark browser tab. -->
  <rect width="32" height="32" rx="7" fill="#0f766e"/>
  <rect x="7"  y="17" width="5" height="9"  rx="1.5" fill="#99f6e4"/>
  <rect x="13.5" y="11" width="5" height="15" rx="1.5" fill="#5eead4"/>
  <rect x="20" y="6"  width="5" height="20" rx="1.5" fill="#ffffff"/>
</svg>
