name: Docs

# Publishes the Sphinx site to GitHub Pages on every push to main.
# An alternative to Read the Docs, not a complement: pick one and delete the
# other, or the two will drift and readers will find whichever ranks higher.
#
# To enable: repository Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - name: Build, warnings are errors
        run: sphinx-build -b html -W docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # Only main publishes. A dev push still builds above, so a broken -W build
  # is caught before it reaches main, but it must not overwrite the live site.
  #
  # The visibility check this once carried was dropped: `event.repository` is
  # populated for a push but not for workflow_dispatch, so a manual run
  # skipped the deploy on a public repository. Pages simply fails on a private
  # repo, which is the clearer signal anyway.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
