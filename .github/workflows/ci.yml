name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # The oldest and newest supported versions on the other platforms,
          # which is where path and float-formatting differences show up.
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,compare]"
      - name: Test
        run: pytest -q --cov=mcdakit --cov-report=term-missing --cov-fail-under=100
      - name: The reversal benchmark must still measure SPOTIS at 0.0%
        run: python benchmarks/reversal.py --trials 200
      # A shell loop here would need one form for bash and another for
      # PowerShell. TestConformanceCli in tests/test_packaging.py already
      # drives the same command for every built-in, cross-platform, so this
      # only has to prove the entry point itself works when invoked directly.
      - name: The conformance CLI runs
        run: python -m mcdakit.testing mcdakit.methods:Spotis --no-strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: No dead code
        run: vulture src/ .vulture-allowlist.py --min-confidence 60

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import mcdakit; print(mcdakit.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - name: Build the docs, warnings are errors
        run: sphinx-build -b html -W docs docs/_build/html
